name: CI

on: [ push, pull_request ]

jobs:

  phpstan:

    name: phpstan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install composer dependencies
        run: |
          composer config policy.advisories.block false
          composer update --prefer-dist --no-interaction

      - name: Run Static Analysis
        run: ./vendor/bin/phpstan analyse -c phpstan.neon --error-format=github

  tests:

    runs-on: ubuntu-latest
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}${{ matrix.dependencies && ' (lowest)' || '' }} Test on ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 10, php: "8.1" }
          - { laravel: 10, php: "8.2" }
          - { laravel: 10, php: "8.3" }
          - { laravel: 11, php: "8.2" }
          - { laravel: 11, php: "8.3" }
          - { laravel: 11, php: "8.4" }
          - { laravel: 11, php: "8.2", dependencies: lowest }
          - { laravel: 12, php: "8.2" }
          - { laravel: 12, php: "8.3" }
          - { laravel: 12, php: "8.4" }
          - { laravel: 12, php: "8.5" }
          - { laravel: 13, php: "8.3" }
          - { laravel: 13, php: "8.4" }
          - { laravel: 13, php: "8.5" }

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: xdebug, redis, apcu
          ini-values: "apc.enable_cli=1"
          coverage: xdebug

      - name: Pin Laravel version
        run: composer require "illuminate/support:^${{ matrix.laravel }}" "illuminate/routing:^${{ matrix.laravel }}" --no-update --no-interaction

      - name: Remove Lumen framework
        if: matrix.laravel >= 12
        run: composer remove --dev laravel/lumen-framework --no-update --no-interaction

      - name: Install composer dependencies
        run: |
          composer config policy.advisories.block false
          EXTRA=""
#          if [[ "${{ matrix.php }}" == "8.5" ]]; then EXTRA="--ignore-platform-req=php"; fi
          if [[ "${{ matrix.dependencies }}" == "lowest" ]]; then EXTRA="$EXTRA --prefer-lowest"; fi
          composer update --prefer-dist --no-interaction $EXTRA

      - name: PHPUnit
        run: |
          if [[ "${{ matrix.laravel }}" -ge 12 ]]; then
            ./vendor/bin/phpunit --configuration=phpunit.xml --coverage-text --exclude-group lumen
          else
            ./vendor/bin/phpunit --configuration=phpunit.xml --coverage-text
          fi
